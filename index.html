<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de Filmes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">CineDrive</div>
      <div class="search">
        <input
          id="searchInput"
          type="search"
          placeholder="Buscar filmes ou episódios"
          aria-label="Buscar filmes ou episódios"
        />
      </div>
    </header>

    <main class="layout">
      <section id="moviesGrid" class="sections" aria-live="polite"></section>
      <div id="emptyState" class="empty" hidden>
        Nenhum filme encontrado.
      </div>
    </main>

    <div id="playerModal" class="modal" aria-hidden="true" role="dialog">
      <div class="modal-content" role="document">
        <button id="closeModal" class="close" type="button" aria-label="Fechar">
          Fechar
        </button>
        <div class="player">
          <iframe
            id="playerFrame"
            title="Reprodutor de vídeo"
            allow="autoplay; fullscreen"
            allowfullscreen
          ></iframe>
        </div>
        <div id="modalTitle" class="modal-title"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
